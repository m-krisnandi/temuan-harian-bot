version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: temuan-harian-web
    restart: unless-stopped
    ports:
      - "${PORT:-8005}:8000"
    env_file:
      - .env
    environment:
      - TEMUAN_DB=/app/data/temuan_harian.db
    volumes:
      - temuan_data:/app/data

volumes:
  temuan_data:
    driver: local
