<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Control Center — Temuan Harian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen px-4 antialiased text-slate-100">
    <div class="bg-slate-900 p-8 rounded-3xl shadow-xl border border-slate-800 max-w-sm w-full text-center">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h1 class="text-base font-extrabold text-white">Temuan Harian</h1>
        <p class="text-xs text-slate-400 mt-1 mb-6">Autentikasi Akses Control Center</p>

        {% if error %}
        <div class="mb-4 text-xs text-rose-400 bg-rose-950/60 p-3 rounded-xl border border-rose-800/60 flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/admin/login" method="POST" class="space-y-4">
            <input type="password" name="password" required placeholder="Kunci Rahasia Admin" class="w-full px-4 py-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl outline-none focus:border-indigo-500 text-center text-white placeholder-slate-500">
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm">
                Masuk ke Dashboard
            </button>
        </form>
        <a href="/" class="inline-flex items-center gap-1.5 mt-5 text-[11px] text-slate-500 hover:text-slate-300 transition">
            <i data-lucide="arrow-left" class="w-3 h-3"></i>
            <span>Kembali ke Katalog Publik</span>
        </a>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
